name: Build and Publish Top 25 Bulletin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, TTS, fonts, and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install pillow gTTS

      - name: Build 9:16 Top 25 news bulletin
        env:
          STUDIO_TEMPLATE_PATH: assets/studio_template_9x16.png
          OUTPUT_MP4_PATH: top25-latest.mp4
        run: |
          python build_bulletin.py
          ls -lh top25-latest.mp4

      - name: Publish to GitHub Release (latest-bulletin)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-bulletin
          name: Latest Top 25 Bulletin
          body: Automated 9:16 Top 25 news bulletin built by Brahmins TV pipeline.
          files: top25-latest.mp4
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
