name: Build and Publish Top 25 Bulletin

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build-bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, fonts, and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          pip install --upgrade pip
          pip install requests edge-tts pillow numpy

      - name: Build 9:16 Top 25 news bulletin
        env:
          NEWS_FEED_URL: ${{ secrets.NEWS_FEED_URL }}
        run: python build_bulletin.py

      - name: Publish to GitHub Release (latest-bulletin)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-bulletin top25-latest.mp4 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest Top 25 Bulletin" \
            --notes "Automated 9:16 Brahmins TV Top 25 News Shots bulletin." \
            || gh release upload latest-bulletin top25-latest.mp4 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
