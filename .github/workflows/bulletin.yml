name: Build and Publish Top 25 Bulletin

on:
  workflow_dispatch:
  schedule:
    # 7:00 AM, 12:00 PM, 5:00 PM, 10:00 PM IST
    - cron: '30 1,6,11,16 * * *'

permissions:
  contents: write

jobs:
  build-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests edge-tts

      - name: Generate Top 25 vertical video
        env:
          NEWS_FEED_URL: ${{ secrets.NEWS_FEED_URL }}
        run: python build_bulletin.py

      - name: Upload video to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest-bulletin top25-latest.mp4 --clobber
