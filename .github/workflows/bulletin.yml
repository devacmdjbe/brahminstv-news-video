name: Build and Publish Top 25 Bulletin

on:
  workflow_dispatch:
  schedule:
    # 7:00 AM, 12:00 PM, 5:00 PM, 10:00 PM IST (UTC+5:30 -> 01:30, 06:30, 11:30, 16:30 UTC)
    - cron: "30 1 * * *"
    - cron: "30 6 * * *"
    - cron: "30 11 * * *"
    - cron: "30 16 * * *"

permissions:
  contents: write

jobs:
  build-bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg, fonts, and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install pillow edge-tts

      - name: Build 9:16 Top 25 news bulletin
        env:
          STUDIO_TEMPLATE_PATH: assets/studio_template_9x16.png
          OUTPUT_MP4_PATH: top25-latest.mp4
          ARCHIVE_JSON_URL: https://script.google.com/macros/s/AKfycbwmR1L1y9LHcNy4H4UWAbCxrK96KsUyKalwDzj-yoojiTNCuqrjo9Vosbv3jNT9xXCt/exec?view=archive
          BTV_ACCESS_TOKEN: ${{ secrets.BTV_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python build_bulletin.py
          ls -lh top25-latest.mp4

      - name: Publish to GitHub Release (latest-bulletin)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-bulletin
          name: Latest Top 25 Bulletin
          body: Automated 9:16 Top 25 news bulletin built by Brahmins TV pipeline.
          files: |
            top25-latest.mp4
            used_bulletins.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish bulletin to Facebook, Instagram & LinkedIn
        env:
          OUTPUT_MP4_PATH: top25-latest.mp4
          USED_JSON_PATH: used_bulletins.json
          RELEASE_TAG: latest-bulletin
          GITHUB_REPOSITORY: ${{ github.repository }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION }}
        run: |
          python publish_bulletin.py
